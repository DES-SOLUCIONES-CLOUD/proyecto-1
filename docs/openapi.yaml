openapi: 3.1.0
info:
  title: Plataforma MOOC API
  version: 0.2.0
  description: >
    API REST de la plataforma web de cursos masivos abiertos en línea.
    Prefijo de versión: /api/v1. Errores uniformes ({"error":{"code","message","details"}}),
    sesiones por cookie httpOnly o cabecera Authorization: Bearer <token>.
    Este documento cubre los endpoints implementados en la iteración actual
    (identidad, administración, autoría de cursos, catálogo e inscripciones).
    Pendientes: quizzes, progreso e insignias (ver README).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Estado del servicio
      operationId: getHealth
      security: []
      responses:
        "200":
          description: El servicio responde correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /auth/register:
    post:
      tags: [Identidad]
      summary: Registro público de estudiantes
      description: >
        Crea una cuenta de estudiante pendiente de verificación y envía el
        enlace. Los profesores y administradores no se crean por aquí: solo
        por administración.


        Responde 202 aunque el correo ya esté registrado y no devuelve el
        recurso creado: cualquiera de las dos cosas convertiría el formulario
        en un oráculo de qué cuentas existen. Si la cuenta existente sigue
        pendiente, se reenvía el enlace de verificación.
      operationId: registerStudent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                full_name: { type: string }
      responses:
        "202":
          description: Solicitud aceptada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        "422": { $ref: '#/components/responses/Error' }
        "429": { $ref: '#/components/responses/Error' }

  /auth/resend-verification:
    post:
      tags: [Identidad]
      summary: Reenviar el enlace de verificación
      description: Responde 202 exista o no la cuenta.
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Solicitud aceptada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        "429": { $ref: '#/components/responses/Error' }

  /auth/verify-email:
    post:
      summary: Confirma el correo mediante el token enviado por correo
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200": { description: Correo verificado; la cuenta queda activa. }
        "400": { description: Token inválido o expirado. }

  /auth/login:
    post:
      summary: Inicio de sesión
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: >
            Sesión creada. Emite la cookie httpOnly `mooc_session` y la cookie
            legible `mooc_csrf`. El token de sesión no viaja en el cuerpo:
            devolverlo dejaría que cualquier script de la página lo leyera.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  expires_at: { type: string, format: date-time }
        "401":
          description: >
            Credenciales inválidas. La respuesta es idéntica para un correo
            inexistente y para una clave errada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403": { $ref: '#/components/responses/Error' }
        "429": { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      summary: Revoca la sesión actual
      operationId: logout
      responses:
        "200": { description: Sesión revocada. }

  /auth/me:
    get:
      summary: Usuario autenticado actual
      operationId: getMe
      responses:
        "200": { description: Datos del usuario. }
        "401": { description: No autenticado. }

  /auth/sessions:
    get:
      tags: [Identidad]
      summary: Listar las sesiones activas
      description: >
        Cada dispositivo con la sesión abierta. Es la evidencia de que las
        sesiones son revocables por el propio usuario.
      operationId: listSessions
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Sesiones activas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
        "401": { $ref: '#/components/responses/Error' }
    delete:
      tags: [Identidad]
      summary: Revocar todas las sesiones salvo la actual
      operationId: revokeOtherSessions
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        "200":
          description: Sesiones revocadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }
        "401": { $ref: '#/components/responses/Error' }
        "403": { $ref: '#/components/responses/Error' }

  /auth/sessions/{sessionId}:
    delete:
      tags: [Identidad]
      summary: Revocar una sesión concreta
      description: >
        Solo sesiones propias, y la revocación surte efecto en la siguiente
        petición del dispositivo afectado. Una sesión ajena responde 404, igual
        que una inexistente, para no confirmar identificadores de otras
        cuentas. Revocar la sesión en curso equivale a cerrarla.
      operationId: revokeSession
      security: [{ sessionCookie: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        "204": { description: Sesión revocada. }
        "401": { $ref: '#/components/responses/Error' }
        "403": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }

  /auth/password/reset-request:
    post:
      summary: Solicita un enlace de recuperación de contraseña
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string } }
      responses:
        "202": { description: Si el correo existe, se envía un enlace (respuesta uniforme para evitar enumeración). }

  /auth/password/reset-confirm:
    post:
      summary: Confirma el restablecimiento de contraseña
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        "200": { description: Contraseña actualizada; sesiones previas revocadas. }
        "400": { description: Token inválido o expirado. }

  /admin/users:
    get:
      summary: Lista usuarios con filtros administrativos
      operationId: listUsers
      parameters:
        - { name: role, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200": { description: Lista de usuarios. }
        "403": { description: Requiere rol admin. }

  /admin/users/{id}/role:
    patch:
      summary: Cambia el rol de un usuario
      operationId: updateUserRole
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties: { role: { type: string, enum: [admin, teacher, student] } }
      responses:
        "200": { description: Rol actualizado. }
        "409": { description: Operación rechazada por proteger al último administrador activo. }

  /admin/users/{id}/status:
    patch:
      summary: Cambia el estado de un usuario (activar/suspender)
      operationId: updateUserStatus
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties: { status: { type: string, enum: [pending_verification, active, suspended] } }
      responses:
        "200": { description: Estado actualizado; si se suspende, se revocan todas sus sesiones. }
        "409": { description: Operación rechazada por proteger al último administrador activo. }

  /admin/teachers:
    post:
      summary: Crea una cuenta de profesor (los profesores no se autorregistran)
      operationId: createTeacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name]
              properties:
                email: { type: string }
                full_name: { type: string }
      responses:
        "201": { description: Profesor creado; se envía enlace para establecer contraseña. }

  /admin/audit:
    get:
      tags: [Administración]
      summary: Consultar la bitácora
      description: >
        Registro inmutable de acciones, el más reciente primero. La base
        rechaza modificarlo o borrarlo mediante un disparador, así que lo que
        se lee aquí es lo que ocurrió.
      operationId: listAudit
      security: [{ sessionCookie: [] }]
      parameters:
        - name: action
          in: query
          schema: { type: string }
          description: Filtra por acción exacta, por ejemplo `user.status_updated`.
        - name: actor_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Entradas de la bitácora.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
        "401": { $ref: '#/components/responses/Error' }
        "403": { $ref: '#/components/responses/Error' }

  /admin/users/{id}/sessions:
    get:
      tags: [Administración]
      summary: Sesiones activas de una cuenta
      operationId: listUserSessions
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sesiones activas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
        "401": { $ref: '#/components/responses/Error' }
        "403": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
    delete:
      tags: [Administración]
      summary: Cerrar todas las sesiones de una cuenta
      description: >
        Expulsa a la persona de todos sus dispositivos sin cambiar el estado de
        la cuenta: es la respuesta a un acceso comprometido cuando la cuenta en
        sí no está en falta. Suspenderla también las cierra.
      operationId: revokeUserSessions
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        "204": { description: Sesiones cerradas. }
        "401": { $ref: '#/components/responses/Error' }
        "403": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }

  /admin/queues:
    get:
      tags: [Administración]
      summary: Estado de las colas y de la dead-letter queue
      description: >
        Evidencia de que el backoff y la dead-letter queue operan: `archived`
        cuenta los trabajos que agotaron sus reintentos, los mismos que
        dispararon la alerta del worker.
      operationId: listQueues
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Colas y tareas archivadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  queues:
                    type: array
                    items: { $ref: '#/components/schemas/QueueInfo' }
                  dead_letter:
                    type: array
                    items: { $ref: '#/components/schemas/DeadTask' }
        "401": { $ref: '#/components/responses/Error' }
        "403": { $ref: '#/components/responses/Error' }
        "503":
          description: La instancia no tiene inspección de cola configurada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/queues/{queue}/dead/{taskId}/retry:
    post:
      tags: [Administración]
      summary: Reencolar una tarea archivada
      description: >
        Conserva el identificador de la tarea, que es su clave de
        idempotencia: el reintento no puede producir una segunda salida de
        algo que ya se completó.
      operationId: retryDeadTask
      security: [{ sessionCookie: [] }]
      parameters:
        - name: queue
          in: path
          required: true
          schema: { type: string }
        - name: taskId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CSRFToken'
      responses:
        "200":
          description: Tarea reencolada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: requeued }
                  task_id: { type: string }
                  queue: { type: string }
        "401": { $ref: '#/components/responses/Error' }
        "403": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
        "503": { $ref: '#/components/responses/Error' }

  /courses:
    post:
      summary: Crea un curso nuevo con su primera versión en borrador
      operationId: createCourseDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, title]
              properties:
                slug: { type: string }
                title: { type: string }
      responses:
        "201": { description: Curso y borrador creados. }

  /courses/mine:
    get:
      summary: Lista los cursos del profesor autenticado
      operationId: listMyCourses
      responses:
        "200": { description: Lista de cursos. }

  /courses/{courseId}/update-draft:
    post:
      summary: Crea la siguiente versión en borrador copiando la estructura publicada
      operationId: createUpdateDraft
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "201": { description: Nuevo borrador creado, con los mismos identificadores estables. }

  /courses/{courseId}/unpublish:
    post:
      summary: Despublica temporalmente la versión vigente para permitir su edición
      operationId: unpublishCourse
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Versión despublicada. }

  /courses/versions/{versionId}:
    get:
      summary: Obtiene una versión (propia) con su árbol completo, para previsualización
      operationId: previewVersion
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Versión con módulos, unidades y recursos. }
        "403": { description: No eres el profesor dueño ni administrador. }
    patch:
      summary: Actualiza metadatos de una versión en borrador
      operationId: updateVersionMetadata
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionMetadataInput" }
      responses:
        "200": { description: Metadatos actualizados. }
        "409": { description: La versión no es un borrador. }

  /courses/versions/{versionId}/publish:
    post:
      summary: Valida y publica una versión en borrador
      operationId: publishVersion
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Versión publicada; la anterior queda unpublished. }
        "422":
          description: Lista exhaustiva de motivos de rechazo (metadatos, estructura, recursos sin procesar).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /courses/versions/{versionId}/modules:
    post:
      summary: Agrega un módulo a una versión en borrador
      operationId: addModule
      parameters: [{ name: versionId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PositionedTitle" }
      responses:
        "201": { description: Módulo creado. }

  /courses/versions/{versionId}/modules/{moduleId}:
    patch:
      summary: Actualiza un módulo
      operationId: updateModule
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: moduleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PositionedTitle" }
      responses:
        "200": { description: Módulo actualizado. }
    delete:
      summary: Elimina un módulo y su contenido
      operationId: deleteModule
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: moduleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Módulo eliminado. }

  /courses/versions/{versionId}/modules/{moduleId}/units:
    post:
      summary: Agrega una unidad a un módulo
      operationId: addUnit
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: moduleId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PositionedTitle" }
      responses:
        "201": { description: Unidad creada. }

  /courses/versions/{versionId}/units/{unitId}:
    patch:
      summary: Actualiza una unidad
      operationId: updateUnit
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PositionedTitle" }
      responses:
        "200": { description: Unidad actualizada. }
    delete:
      summary: Elimina una unidad y sus recursos
      operationId: deleteUnit
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Unidad eliminada. }

  /courses/versions/{versionId}/units/{unitId}/resources:
    post:
      summary: Agrega un recurso a una unidad
      operationId: addResource
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceInput" }
      responses:
        "201": { description: Recurso creado. }

  /courses/versions/{versionId}/resources/{resourceId}:
    patch:
      summary: Actualiza un recurso
      operationId: updateResource
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceInput" }
      responses:
        "200": { description: Recurso actualizado. }
    delete:
      summary: Elimina un recurso
      operationId: deleteResource
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Recurso eliminado. }

  /courses/versions/{versionId}/resources/{resourceId}/upload-url:
    post:
      summary: Emite una URL prefirmada de subida directa al almacenamiento de objetos
      operationId: requestResourceUploadURL
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { mime_type: { type: string } }
      responses:
        "200": { description: URL prefirmada (PUT) y clave de objeto. }

  /courses/versions/{versionId}/resources/{resourceId}/confirm-upload:
    post:
      summary: Confirma una subida y encola el procesamiento asíncrono si aplica (video/audio)
      operationId: confirmResourceUpload
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Recurso listo de inmediato (no requiere procesamiento). }
        "202": { description: Trabajo de transcodificación encolado (video/audio). }

  /catalog:
    get:
      summary: Catálogo de cursos publicados, con búsqueda y filtros
      operationId: listCatalog
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200": { description: Lista de versiones publicadas. }

  /catalog/{courseId}:
    get:
      summary: Detalle de la versión publicada vigente de un curso
      operationId: getPublishedCourse
      security: []
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Versión publicada con su árbol de contenido. }
        "404": { description: El curso no tiene versión publicada. }

  /resources/{resourceId}/content:
    get:
      tags: [Multimedia]
      summary: Contenido de un recurso para el estudiante
      description: >
        Devuelve lo necesario para presentar el recurso: la lista maestra HLS
        en video y audio, la URL del objeto en PDF, imagen y descargables, el
        Markdown en los recursos de texto, y la URL externa en enlaces e
        iframes. En video y audio incluye además la última posición reportada,
        para reanudar donde se dejó.


        La autorización ocurre antes de resolver ninguna URL: el recurso debe
        pertenecer a la versión vigente del curso, ser visible, y quien lo pide
        debe estar inscrito (el profesor dueño y la administración pasan sin
        inscripción). Un recurso oculto, de un borrador o de una versión
        retirada responde como inexistente.


        La URL procede del CDN cuando `S3_PUBLIC_URL` está configurado, y de
        una firma temporal en caso contrario. El reproductor pide los segmentos
        HLS con rutas relativas al manifiesto, así que su autorización la
        resuelve el CDN, que además debe permitir el origen del frontend por
        CORS para que hls.js pueda leerlos.
      operationId: resourceContent
      security: [{ sessionCookie: [] }]
      parameters:
        - name: resourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Contenido del recurso.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceContent' }
        "401": { $ref: '#/components/responses/Error' }
        "404":
          description: El recurso no existe, está oculto o quien lo pide no está inscrito.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "409":
          description: El recurso existe pero su transcodificación no ha terminado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /resources/{resourceId}/position:
    put:
      tags: [Multimedia]
      summary: Reportar la posición de reproducción
      description: >
        Registra el segundo donde reanudar un video o un audio.


        Es una comodidad reportada por el cliente y **no acredita avance**: el
        progreso lo calcula el servidor a partir de heartbeats y eventos de
        apertura, así que lo que llegue aquí no sostiene ninguna decisión
        académica. Se guarda por inscripción y contra el `stable_id` del
        recurso, de modo que sobrevive a la publicación de una versión nueva.
      operationId: saveResourcePosition
      security: [{ sessionCookie: [] }]
      parameters:
        - name: resourceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position_seconds]
              properties:
                position_seconds:
                  type: integer
                  minimum: 0
                  maximum: 86400
      responses:
        "204": { description: Posición registrada. }
        "401": { $ref: '#/components/responses/Error' }
        "404": { $ref: '#/components/responses/Error' }
        "422":
          description: Posición fuera de rango, o el recurso no se reproduce.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /enrollments:
    post:
      summary: Inscribe al estudiante autenticado en un curso publicado
      operationId: enroll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course_id]
              properties: { course_id: { type: string, format: uuid } }
      responses:
        "201": { description: Inscripción creada (o reactivada si era una reinscripción). }
        "409": { description: Ya inscrito o el curso no tiene versión publicada. }

  /enrollments/mine:
    get:
      summary: Lista las inscripciones del estudiante autenticado
      operationId: listMyEnrollments
      responses:
        "200": { description: Lista de inscripciones. }

  /enrollments/{courseId}/withdraw:
    post:
      summary: Retira al estudiante de un curso, conservando su progreso
      operationId: withdraw
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Inscripción retirada. }

  /courses/versions/{versionId}/resources/{resourceId}/quiz:
    put:
      tags: [Evaluacion]
      summary: Define o reemplaza la evaluacion de un recurso de tipo quiz
      description: >
        Solo el profesor dueno y sobre una version en borrador. La respuesta no
        devuelve las preguntas: incluirlas expondria la clave correcta.
      operationId: definirQuiz
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, questions]
              properties:
                title: { type: string }
                time_limit_seconds: { type: integer, nullable: true }
                max_attempts: { type: integer, nullable: true }
                pass_score: { type: number, minimum: 0, maximum: 100 }
                feedback_policy:
                  type: string
                  enum: [immediate, after_submit, after_close, none]
                shuffle_questions: { type: boolean }
                questions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [prompt_md, type, options]
                    properties:
                      prompt_md: { type: string }
                      type: { type: string, enum: [single, multiple] }
                      points: { type: number, exclusiveMinimum: 0 }
                      options:
                        type: array
                        minItems: 2
                        items:
                          type: object
                          required: [text_md]
                          properties:
                            text_md: { type: string }
                            is_correct: { type: boolean }
      responses:
        "200": { description: Evaluacion guardada. }
        "409": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }

  /recursos/{resourceId}/quiz/intentos:
    post:
      tags: [Evaluacion]
      summary: Abre un intento, o devuelve el que ya estuviera en curso
      description: >
        Recargar la pagina no gasta un intento: si hay uno abierto se devuelve
        ese. Las opciones viajan sin ninguna marca de cual es la correcta.
      operationId: iniciarIntento
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Intento abierto. }
        "409":
          description: Se agoto el numero maximo de intentos.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /quiz/intentos/{attemptId}:
    get:
      tags: [Evaluacion]
      summary: Consulta un intento propio
      operationId: verIntento
      parameters:
        - { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Estado del intento. }
        "404":
          description: >
            Tambien se responde asi para un intento de otra persona: confirmar
            que existe ya seria filtrar informacion ajena.

  /quiz/intentos/{attemptId}/respuestas:
    put:
      tags: [Evaluacion]
      summary: Guardado parcial de una pregunta
      description: >
        Se valida que la pregunta y las opciones pertenezcan al snapshot del
        intento, y que una pregunta de respuesta unica no reciba varias.
      operationId: guardarRespuesta
      parameters:
        - { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_stable_id, selected_option_stable_ids]
              properties:
                question_stable_id: { type: string, format: uuid }
                selected_option_stable_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200": { description: Respuesta guardada. }
        "409": { $ref: "#/components/responses/Problema" }
        "422": { $ref: "#/components/responses/Problema" }

  /quiz/intentos/{attemptId}/enviar:
    post:
      tags: [Evaluacion]
      summary: Envio definitivo y calificacion en servidor
      description: >
        La nota se calcula contra el snapshot congelado al iniciar, asi que es
        reproducible aunque el autor edite el quiz despues. Reintentar con la
        misma Idempotency-Key devuelve la nota ya calculada en vez de calificar
        otra vez.
      operationId: enviarIntento
      parameters:
        - { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200": { description: Intento calificado. }
        "409": { $ref: "#/components/responses/Problema" }

  /recursos/{resourceId}/progreso:
    post:
      tags: [Progreso]
      summary: Reporta una senal de progreso
      description: >
        El cliente reporta que abrio, que sigue ahi o que cerro. El servidor
        decide cuanto tiempo acredita comparando marcas de tiempo propias: un
        porcentaje enviado por el cliente no se acepta. Las senales
        implausibles se descartan y se auditan.
      operationId: registrarProgreso
      parameters:
        - { name: resourceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [open, heartbeat, close] }
                complete: { type: boolean }
      responses:
        "200": { description: Resumen de avance actualizado. }
        "422": { $ref: "#/components/responses/Problema" }

  /cursos/{courseId}/progreso:
    get:
      tags: [Progreso]
      summary: Resumen de avance del estudiante en un curso
      operationId: verProgreso
      parameters:
        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Porcentaje de obligatorios, estado e insignia. }

  /insignias/mias:
    get:
      tags: [Insignias]
      summary: Lista las insignias del estudiante autenticado
      operationId: misInsignias
      responses:
        "200": { description: Lista de insignias. }

  /insignias/{codigo}:
    get:
      tags: [Insignias]
      summary: Verificacion publica de una insignia
      description: >
        No exige sesion, que es el sentido de una insignia verificable. No
        expone el correo ni el identificador del estudiante.
      operationId: verificarInsignia
      security: []
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Estado de la insignia. }
        "404": { $ref: "#/components/responses/Problema" }

  /insignias/{codigo}/revocar:
    post:
      tags: [Insignias]
      summary: Revoca una insignia (solo administracion)
      description: >
        La URL publica sigue resolviendo, pero reporta el estado revocado. La
        revocacion queda auditada.
      operationId: revocarInsignia
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200": { description: Insignia revocada. }

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 200 }
      description: >
        Hace repetible la operación durante 24 horas: reintentar con la misma
        clave devuelve la respuesta guardada sin volver a ejecutar nada. La
        repetición se marca con la cabecera `Idempotency-Replayed: true`.
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: >
        Valor de la cookie `mooc_csrf`, que la API emite junto con la sesión.
        Se exige en toda operación que cambie estado y se autentique por
        cookie; un sitio atacante no puede leerla para rellenarlo.

  responses:
    Error:
      description: Error uniforme.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mooc_session
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    User:
      type: object
      required: [id, email, full_name, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        role:
          type: string
          enum: [admin, teacher, student]
        status:
          type: string
          enum: [pending_verification, active, suspended]
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    AuditEntry:
      type: object
      required: [id, action, entity_type, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        actor_email:
          type: string
          description: Vacío si la cuenta que actuó fue eliminada; el hecho auditado sobrevive a su autor.
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        metadata: { type: object, additionalProperties: true }
        ip_address: { type: string }
        created_at: { type: string, format: date-time }
    ResourceContent:
      type: object
      required: [type, title, downloadable]
      properties:
        type:
          type: string
          enum: [text, image, video, audio, pdf, presentation, file, iframe, link, quiz]
        title: { type: string }
        downloadable: { type: boolean }
        url:
          type: string
          format: uri
          description: Lista maestra HLS en video y audio; el archivo en PDF, imagen y descargables.
        cdn:
          type: boolean
          description: Indica si la URL viene de una base pública y por tanto no caduca.
        expires_in:
          type: integer
          description: Segundos de validez cuando la URL va firmada.
        markdown:
          type: string
          description: Contenido de los recursos de texto.
        external_url:
          type: string
          format: uri
          description: Destino de enlaces e iframes.
        position_seconds:
          type: integer
          description: Segundo donde reanudar. Solo en video y audio.
    QueueInfo:
      type: object
      properties:
        queue: { type: string }
        pending: { type: integer }
        active: { type: integer }
        retry: { type: integer }
        archived:
          type: integer
          description: Trabajos que agotaron sus reintentos y están en la dead-letter queue.
        completed: { type: integer }
        failed: { type: integer }
    DeadTask:
      type: object
      properties:
        id: { type: string }
        queue: { type: string }
        type: { type: string }
        last_error: { type: string }
        last_failed_at: { type: string, format: date-time }
        retried: { type: integer }
    Session:
      type: object
      required: [id, created_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ip_address: { type: string }
        user_agent: { type: string }
        current:
          type: boolean
          description: Indica si es la sesión que hace la petición.
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: string } }
    PositionedTitle:
      type: object
      required: [title, position]
      properties:
        title: { type: string }
        position: { type: integer }
    VersionMetadataInput:
      type: object
      properties:
        title: { type: string }
        summary: { type: string }
        description_md: { type: string }
        category: { type: string }
        level: { type: string }
        language: { type: string }
        approval_min_score: { type: number }
        approval_required_resources_pct: { type: number }
    ResourceInput:
      type: object
      required: [type, title, position]
      properties:
        type:
          type: string
          enum: [text, image, video, audio, pdf, presentation, file, iframe, link, quiz]
        title: { type: string }
        position: { type: integer }
        visible: { type: boolean }
        required: { type: boolean }
        downloadable: { type: boolean }
        text_content_md: { type: string }
        external_url: { type: string }
