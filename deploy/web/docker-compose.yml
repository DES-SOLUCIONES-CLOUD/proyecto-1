# Web Server (GCE e2-small, subred web con IP estática): proxy TLS, API y
# Mailpit.
#
#   sudo /opt/mooc/actual/deploy/gcp/en-vm.sh web
#
# No se lanza a mano con `docker compose up`: DB_PASSWORD y S3_SECRET_KEY no
# están en ningún archivo, las lee en-vm.sh de Secret Manager con la cuenta
# de servicio de la VM y las exporta solo para esa invocación (y se niega a
# seguir si llegan vacías). Aquí no se marcan como obligatorias porque
# Compose interpola el archivo entero, también los servicios de otros
# perfiles, y eso obligaría a tenerlas a mano hasta para pedir un
# certificado. Por lo mismo las imágenes tienen un valor por defecto
# inservible en lugar de :?: en-vm.sh fija las del commit desplegado.
#
# Presupuesto de memoria (2 GB, ~1,6 disponibles tras el sistema, Docker y
# el Ops Agent): api 768 MiB, nginx 128, mailpit 96, frontend opcional 384.
# Los límites existen para que un pico de uno termine en un reinicio de ese
# contenedor y no en el OOM killer eligiendo víctima entre todos.

name: mooc-web

x-registro: &registro
  # Rotación de logs: con el driver por defecto crecen sin límite y un disco de
  # 30 GiB se llena en una prueba de estrés larga.
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  api:
    <<: *registro
    # De Artifact Registry (deploy/gcp/publicar.sh). Sin `build`: compilar en
    # una e2-small agota la memoria y la ráfaga de CPU.
    image: ${IMAGEN_API:-sin-publicar/mooc-api}
    restart: unless-stopped
    mem_limit: 768m
    environment:
      APP_ENV: production
      API_PORT: 8080
      # IP privada de Cloud SQL. sslmode=require: la instancia tiene
      # ssl_mode=ENCRYPTED_ONLY y rechaza conexiones sin TLS; declararlo aquí
      # hace que el fallo sea del cliente y explícito si alguien lo cambia.
      # No verifica la CA del servidor (verify-ca exigiría distribuir su
      # certificado); la red es privada y el peering, de Google.
      DATABASE_URL: postgres://${DB_USER:?falta DB_USER}:${DB_PASSWORD:-}@${DB_HOST:?falta DB_HOST}:5432/${DB_NAME:?falta DB_NAME}?sslmode=require
      # Pool de la API. Sumado al del worker tiene que caber en el
      # max_connections de Cloud SQL (ver deploy/gcp/README.md).
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      # IP interna fija del Worker Server. Redis no tiene contraseña: lo
      # protege el firewall, que solo admite la cuenta de servicio del Web
      # (ver deploy/worker).
      REDIS_ADDR: ${REDIS_ADDR:?falta REDIS_ADDR (IP interna del worker):6379}
      # API XML de Cloud Storage. Exactamente este host: minio-go solo
      # reconoce GCS por él (y ajusta la subida de objetos a lo que GCS
      # admite); un endpoint regional o private.googleapis.com se trataría
      # como un S3 genérico.
      S3_ENDPOINT: storage.googleapis.com
      S3_PUBLIC_ENDPOINT: storage.googleapis.com
      # Región del ámbito de la firma SigV4 que espera GCS.
      S3_REGION: auto
      S3_BUCKET: ${S3_BUCKET:?falta S3_BUCKET}
      # Los derivados hls/* van a un bucket aparte legible por cualquiera:
      # el reproductor pide variantes y segmentos sin firma.
      S3_BUCKET_HLS: ${S3_BUCKET_HLS:?falta S3_BUCKET_HLS}
      # Clave HMAC de la cuenta de servicio de la API. El identificador está
      # en el .env; el secreto lo trae en-vm.sh de Secret Manager.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?falta S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_USE_SSL: "true"
      S3_PUBLIC_USE_SSL: "true"
      # Los buckets los crea Terraform; un nombre mal escrito tiene que
      # fallar, no crear un bucket sin CORS ni prevención de acceso público.
      S3_CREATE_BUCKET: "false"
      # Vacía a propósito: sin CDN en esta entrega todo se firma uno a uno.
      # Rellenarla quitaría la firma de TODAS las claves, originales
      # incluidos, no solo las de HLS.
      S3_PUBLIC_URL: ""
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?falta PUBLIC_BASE_URL (https://...)}
      COOKIE_SECURE: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-no-reply@mooc.local}
      CLAMAV_ADDR: ""
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-}
      BADGE_SIGNING_KEY: ${BADGE_SIGNING_KEY:-}
      BADGE_KEY_ID: ${BADGE_KEY_ID:-mooc-badges-1}
      ISSUER_NAME: ${ISSUER_NAME:-Plataforma MOOC}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    depends_on:
      mailpit:
        condition: service_started

  nginx:
    <<: *registro
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/web-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - certificados:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz-proxy"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      api:
        condition: service_started

  # SMTP de pruebas. Sin él el registro responde 500: la API devuelve el error
  # del envío del correo de verificación. No hay SMTP real en esta entrega (y
  # GCE bloquea el puerto 25 saliente); los correos quedan aquí y la interfaz
  # se consulta por túnel SSH sobre IAP:
  #   deploy/gcp/remoto.sh web -- -L 8025:127.0.0.1:8025 -N
  # Publicado solo en 127.0.0.1: el firewall no lo expone, pero tampoco se
  # confía solo en él.
  mailpit:
    <<: *registro
    image: axllent/mailpit:v1.22
    restart: unless-stopped
    mem_limit: 96m
    ports:
      - "127.0.0.1:8025:8025"
    expose: ["1025"]

  # Migraciones como paso explícito: `deploy/gcp/migrar.sh`.
  migrate:
    image: ${IMAGEN_MIGRATE:-sin-publicar/mooc-migrate}
    profiles: ["operacion"]
    environment:
      DATABASE_URL: postgres://${DB_USER:?falta DB_USER}:${DB_PASSWORD:-}@${DB_HOST:?falta DB_HOST}:5432/${DB_NAME:?falta DB_NAME}?sslmode=require

  # Datos sintéticos de las pruebas de carga: `en-vm.sh sembrar`. Corre aquí
  # porque Cloud SQL solo es alcanzable desde las dos VM.
  #
  # El sembrador se niega a correr fuera de development/test/ci: crea cuentas
  # con una contraseña pública y abre sus sesiones. Este entorno es de
  # pruebas de la entrega, no de producción real, y se declara a conciencia
  # con SEED_PERMITIR_ENTORNO=1 en lugar de disfrazar APP_ENV. Antes de dar
  # la plataforma por pública habría que borrar esas cuentas.
  seed:
    image: ${IMAGEN_SEED:-sin-publicar/mooc-seed}
    profiles: ["operacion"]
    environment:
      APP_ENV: production
      SEED_PERMITIR_ENTORNO: "1"
      DATABASE_URL: postgres://${DB_USER:?falta DB_USER}:${DB_PASSWORD:-}@${DB_HOST:?falta DB_HOST}:5432/${DB_NAME:?falta DB_NAME}?sslmode=require
      SEED_STUDENTS: ${SEED_STUDENTS:-500}
      SEED_OUT: /salida/escenario.json
    volumes:
      - /opt/mooc/salida:/salida

  # Emisión y renovación de certificados: deploy/web/certificado.sh.
  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["operacion"]
    volumes:
      - certificados:/etc/letsencrypt
      - acme:/var/www/certbot

  # Frontend existente, opcional: `COMPOSE_PROFILES=frontend` en el .env y
  # `deploy/gcp/publicar.sh --frontend`, que compila con NEXT_PUBLIC_API_URL
  # (Next la incrusta al compilar, no al arrancar). Se sirve por el mismo
  # origen que la API, así que no necesita CORS contra ella.
  frontend:
    <<: *registro
    image: ${IMAGEN_FRONTEND:-sin-publicar/mooc-frontend}
    profiles: ["frontend"]
    restart: unless-stopped
    mem_limit: 384m
    expose: ["3000"]

volumes:
  certificados:
  acme:
