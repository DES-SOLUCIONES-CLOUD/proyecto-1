# Proxy de entrada del Web Server en GCP (deploy/web/docker-compose.yml).
#
# Frente a api.conf, que sirve al compose local: termina TLS, redirige 80 a
# 443 y no reparte entre réplicas (en esta entrega hay una sola API por
# máquina y no hay escalado).
#
# La API se resuelve con el DNS de Docker en cada petición, no una vez al
# arrancar. Un upstream estático fija la IP del contenedor que había al
# iniciar nginx: al redesplegar, la API nueva puede recibir otra y nginx
# respondería 502 hasta reiniciarlo. Además, así nginx arranca aunque la API
# no exista todavía, que es lo que necesita certificado.sh para servir el
# reto de Let's Encrypt.
#
# El certificado vive siempre en la misma ruta, /etc/letsencrypt/live/mooc/,
# lo emita Let's Encrypt (certbot --cert-name mooc) o sea el autofirmado de
# respaldo. Así esta configuración no cambia con el nombre del host ni con el
# tipo de certificado: ver deploy/web/certificado.sh.

server {
    listen 80;
    server_name _;

    # Reto HTTP-01 de Let's Encrypt: tiene que responderse por HTTP plano,
    # antes de la redirección.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz-proxy {
        access_log off;
        return 200 "ok\n";
    }

    # 301 y no 302: el navegador lo recuerda y deja de intentar HTTP. Las
    # cookies de sesión llevan Secure (COOKIE_SECURE=true), así que por HTTP
    # la sesión no funcionaría de todos modos.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/mooc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mooc/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1d;

    # Un año, sin includeSubDomains ni preload: con sslip.io el dominio padre
    # no es nuestro, y con un dominio propio esa decisión es de su dueño.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Las subidas van directas a Cloud Storage con URL prefirmada, así que
    # por aquí solo pasa JSON. El límite está bajo a propósito: un cuerpo de megabytes
    # contra la API es un error o un abuso, no un caso legítimo.
    client_max_body_size 4m;

    # Cabeceras comunes a todas las rutas de la API.
    #
    # X-Forwarded-For se SOBRESCRIBE con la dirección real del cliente, no se
    # le añade ($proxy_add_x_forwarded_for): la API deduce la IP del primer
    # elemento para el límite de tasa, y conservar lo que mandó el cliente
    # permitiría saltarse el límite de login inventando una IP por intento.
    # Este proxy es el único salto; si algún día hay un balanceador o un CDN
    # delante, esto cambia a la vez que se decide en cuál se confía.
    #
    # X-Forwarded-Proto va fijo a https: aquí siempre lo es, y la API no debe
    # poder deducir otra cosa si alguien manda la cabecera.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api http://api:8080;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Confirmar una carga relee el objeto completo del almacén para calcular el
    # checksum, detectar el MIME real y pasar el antimalware: con un vídeo de
    # cientos de MB eso supera con holgura el minuto. Cortarlo aquí dejaría la
    # carga confirmada en la API y un 504 en el cliente, que reintentaría.
    location ~ ^/api/v1/courses/versions/[^/]+/resources/[^/]+/(confirm-upload|multipart/complete)$ {
        proxy_pass $api$request_uri;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass $api$request_uri;
    }

    location = /healthz-proxy {
        access_log off;
        return 200 "ok\n";
    }

    # Frontend (perfil "frontend" del compose, encendido por defecto). Se
    # resuelve en cada petición con el DNS de Docker para que nginx arranque
    # aunque el contenedor aún no exista. Si no está, "/" responde 404 y la
    # API en /api/v1 sigue.
    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        proxy_intercept_errors on;
        error_page 502 503 504 = @sin_frontend;
    }

    location @sin_frontend {
        default_type text/plain;
        return 404 "El frontend no está arriba: la API sigue en /api/v1/\n";
    }
}
