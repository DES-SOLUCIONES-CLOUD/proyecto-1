# Construye las imágenes en Cloud Build (alternativa a publicar.sh cuando no
# hay Docker local o la red no deja subir capas grandes, p. ej. Cloud Shell).
#
#   gcloud builds submit --config deploy/gcp/cloudbuild.yaml \
#     --service-account projects/<proyecto>/serviceAccounts/mooc-build@<proyecto>.iam.gserviceaccount.com \
#     --substitutions _REGISTRO=<registro>,_TAG=<commit>,_API_URL=<url pública> .
#
# Ver deploy/gcp/publicar-cloudbuild.sh.
steps:
  - id: api
    name: gcr.io/cloud-builders/docker
    args: [build, --target, api, --build-arg, VERSION=$_TAG, -t, $_REGISTRO/mooc-api:$_TAG, backend]
  - id: worker
    name: gcr.io/cloud-builders/docker
    args: [build, --target, worker, --build-arg, VERSION=$_TAG, -t, $_REGISTRO/mooc-worker:$_TAG, backend]
    waitFor: ["-"]
  - id: migrate
    name: gcr.io/cloud-builders/docker
    args: [build, --target, migrate, -t, $_REGISTRO/mooc-migrate:$_TAG, backend]
    waitFor: [api]
  - id: frontend
    name: gcr.io/cloud-builders/docker
    args: [build, --build-arg, NEXT_PUBLIC_API_URL=$_API_URL, --build-arg, NEXT_PUBLIC_VERSION=$_TAG, -t, $_REGISTRO/mooc-frontend:$_TAG, frontend]
    waitFor: ["-"]
images:
  - $_REGISTRO/mooc-api:$_TAG
  - $_REGISTRO/mooc-worker:$_TAG
  - $_REGISTRO/mooc-migrate:$_TAG
  - $_REGISTRO/mooc-frontend:$_TAG
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
