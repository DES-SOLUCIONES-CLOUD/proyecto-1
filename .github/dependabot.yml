# Vigilancia de dependencias.
#
# Existe por un episodio concreto: next@14.2.35 se quedó quieto en el
# package.json mientras acumulaba más de veinte advisories, varios críticos, y
# nadie se enteró hasta que el paso de análisis de seguridad del CI tumbó una
# rama. `npm audit` en el pipeline lo detecta, pero solo cuando alguien empuja;
# entre una corrida y otra no avisa nadie. Esto cierra ese hueco.
#
# Dos cosas que conviene distinguir:
#
#   - Este archivo configura las actualizaciones DE VERSIÓN: las programadas,
#     las que llegan aunque no haya ninguna vulnerabilidad.
#   - Las actualizaciones DE SEGURIDAD son otra cosa y NO se activan desde
#     aquí: hay que encenderlas en Settings → Code security → Dependabot
#     ("Dependabot alerts" y "Dependabot security updates"). Abren un PR en
#     cuanto aparece un advisory, sin esperar al día señalado. Son las que
#     habrían avisado de lo de Next, así que este archivo por sí solo no
#     resuelve el problema: hay que dar ese paso en la configuración del
#     repositorio.

version: 2

updates:
  # ---------------------------------------------------------------------
  # Frontend (npm)
  # ---------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    labels: ["dependencias", "frontend"]
    commit-message:
      prefix: "deps"
      include: scope

    # Agrupar es lo que decide si esto se usa o se ignora. Sin grupos,
    # Dependabot abre un PR por paquete y la avalancha acaba en que nadie los
    # mira, que es peor que no tenerlo. Parches y menores van en un solo PR
    # semanal; las mayores van sueltas, porque cada una es una decisión con
    # posible rotura detrás, como fue el propio salto a Next 16.
    #
    # NO se ignoran las mayores, aunque sean las más ruidosas. El motivo es
    # exactamente el episodio que motivó este archivo: la corrección de los
    # advisories de Next exigía subir de 14 a 16, es decir, una mayor. Si un
    # `ignore` de mayores llegara a alcanzar también a las actualizaciones de
    # seguridad —la documentación de GitHub no es tajante y no conviene
    # apostar— habríamos desactivado justo la alerta que hacía falta. Un PR de
    # más se cierra en dos clics; un advisory que nunca llega, no.
    groups:
      frontend-menores:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------
  # Backend (Go)
  # ---------------------------------------------------------------------
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 5
    labels: ["dependencias", "backend"]
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      backend-menores:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------
  # Imágenes base de los contenedores
  #
  # Una imagen base sin actualizar es la vía más silenciosa de arrastrar
  # vulnerabilidades: no aparece en ningún package.json ni en ningún go.mod, y
  # ni `npm audit` ni `govulncheck` la miran.
  # ---------------------------------------------------------------------
  - package-ecosystem: docker
    directories:
      - /frontend
      - /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 3
    labels: ["dependencias", "docker"]
    commit-message:
      prefix: "deps"

  # ---------------------------------------------------------------------
  # Acciones del propio pipeline
  #
  # Corren con acceso al repositorio y a los secretos, así que envejecen peor
  # que una dependencia normal.
  # ---------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Bogota
    open-pull-requests-limit: 3
    labels: ["dependencias", "ci"]
    commit-message:
      prefix: "deps"
    groups:
      acciones:
        patterns: ["*"]
