# configuracion del analisis de sonarqube (entrega 3)
# la usan el pipeline (.github/workflows/sonar.yml) y la corrida local
# (deploy/sonarqube/analizar.sh), asi el panel muestra lo mismo que el ci

sonar.projectKey=mooc-plataforma
sonar.projectName=Plataforma MOOC
sonar.sourceEncoding=UTF-8

# solo se mide el backend (go) y el frontend (typescript)
# los scripts de despliegue y de carga quedan fuera
sonar.sources=backend,frontend
sonar.tests=backend,frontend
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,frontend/e2e/**
sonar.exclusions=**/node_modules/**,**/.next/**,**/*_test.go,**/*.test.ts,**/*.test.tsx,\
  frontend/e2e/**,frontend/public/**,frontend/next-env.d.ts,\
  frontend/playwright-report/**,frontend/test-results/**,\
  backend/migrations/**,backend/internal/platform/postgres/pgtest/**

# las migraciones no se editan despues de aplicarlas, no tiene sentido
# contarlas como duplicacion
sonar.cpd.exclusions=backend/migrations/**

# cobertura del backend, la genera el pipeline antes de analizar
# si no existe (por ejemplo en local sin go) sonar solo muestra un aviso
sonar.go.coverage.reportPaths=backend/coverage.out
